name: Tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s tests -v

  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift scanner and local history
        run: ./macOS/test.sh
      - name: Build native macOS app
        run: ./macOS/build.sh
      - name: Check app signature
        run: codesign --verify --deep --strict macOS/build/WhatsCop.app
